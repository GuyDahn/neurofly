[project]
name = "neurofly-data"
version = "0.0.0"
description = "Local tooling for MaleCNS inputs. Raw and baked neuron data stay out of git."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "pygltflib>=1.16.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
make-data = "neurofly_data.make_data:main"
compass-cells = "neurofly_data.compass_cells:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
