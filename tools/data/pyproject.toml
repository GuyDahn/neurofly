[project]
name = "neurofly-data"
version = "0.0.0"
description = "Local tooling for MaleCNS inputs. Raw and baked neuron data stay out of git."
requires-python = ">=3.12"
readme = "README.md"

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
