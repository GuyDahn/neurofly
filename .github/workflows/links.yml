name: Links

on:
  schedule:
    # Mondays, 06:00 UTC: outside sites move without telling anyone.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.md"
      - "apps/web/src/site/site.ts"
      - "lychee.toml"
      - ".github/workflows/links.yml"

permissions:
  contents: read

jobs:
  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            './**/*.md'
            apps/web/src/site/site.ts
          fail: true
        env:
          # Higher GitHub rate limits for the many github.com links.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
